<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vapor Cars</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="header">
    <img src="logo.png" alt="">
  </div>

  <section class="slideshow-container">

    <div class="slide">
      <h2 class="slide-car">Find</h2>
      <img src="./images.jpg" alt="A plated dessert">
    </div>

    <div class="slide">
      <h2 class="slide-car">Your</h2>
      <img src="./images (1).jpg" alt="A breakfast spread">
    </div>
    <div class="slide">
      <h2 class="slide-car">Suitable</h2>
      <img src="./car_1.jpg" alt="A breakfast spread">
    </div>
    <div class="slide">
      <h2 class="slide-car">Car</h2>
      <img src="./car_2.avif" alt="A breakfast spread">
    </div>






  </section>



  <div class="frame">
    <form id="searchForm">
      <input type="text" id="searchCar" placeholder="What do you feel like td?" autocomplete="off">
      <ion-icon name="search"></ion-icon>
      <button id="search-btn">Search</button>
    </form>

    <div class="filter">
      <p>Sort By:</p>
      <button id="priceBtn">Price</button>
      <button id="ratingBtn">Ratings</button>
      <button id="recBtn">Recommended</button>
    </div>
  </div>

  <section id="car-models">

    <div class="cars-wrapper">


    </div>
    <div class="modal-wrapper hide">





    </div>


  </section>
  


  <footer>© 2026 Vapor Corporation. All rights reserved. 
  </footer>





  <script type="module" src="script.js"></script>
</body>

</html>
